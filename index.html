<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0f0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Dolina — Ashblade combat prototype (Emberfall). Dotikalna ARPG." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Dolina · Emberfall</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; -webkit-tap-highlight-color: transparent; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0f0a; color: #f5e6d3; font-family: system-ui, "Segoe UI", sans-serif; }
      #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
      #game-canvas { flex: 1; width: 100%; height: 100%; display: block; background: #2a1a10; }
      #hud {
        position: absolute; left: 0; right: 0; bottom: 0;
        padding: 10px 12px calc(14px + env(safe-area-inset-bottom, 0px));
        padding-left: max(12px, env(safe-area-inset-left, 0px));
        padding-right: max(12px, env(safe-area-inset-right, 0px));
        background: linear-gradient(transparent, rgba(12,6,4,0.94) 30%);
        pointer-events: none;
      }
      #bars { display: flex; gap: 10px; margin-bottom: 10px; pointer-events: none; }
      .bar-wrap { flex: 1; background: #2a1810; border: 1px solid #5a3a28; border-radius: 10px; overflow: hidden; height: 26px; position: relative; }
      .bar-fill { height: 100%; transition: width 0.12s linear; }
      #hp-fill { background: linear-gradient(90deg, #8b1e1e, #d44); width: 100%; }
      #ember-fill { background: linear-gradient(90deg, #b85a10, #f0a030); width: 100%; }
      .bar-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px #000; pointer-events: none; }
      #skills {
        display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 12px; pointer-events: auto;
      }
      .skill-btn {
        position: relative;
        min-height: 84px; border: 2px solid #6a4030; border-radius: 16px; background: #3a2218;
        color: #f5e6d3; font-size: 14px; font-weight: 700; padding: 10px 8px; cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(255,180,80,0.15), 0 5px 0 #1a0e08;
        user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        overflow: hidden;
        --cd-pct: 0%;
      }
      .skill-btn::after {
        content: "";
        position: absolute; left: 0; right: 0; bottom: 0;
        height: var(--cd-pct);
        background: rgba(8,4,2,0.62);
        pointer-events: none;
        transition: height 0.08s linear;
      }
      .skill-btn:active, .skill-btn.pressed { transform: translateY(3px); box-shadow: inset 0 0 0 1px rgba(255,180,80,0.15); background: #4a2c1c; }
      .skill-btn.cd { opacity: 0.88; }
      .skill-btn .name { font-size: 13px; letter-spacing: 0.02em; position: relative; z-index: 1; }
      .skill-btn .hint { font-size: 11px; opacity: 0.75; font-weight: 500; position: relative; z-index: 1; }
      .skill-btn .cd-num {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 22px; font-weight: 800; color: #ffe0a0; text-shadow: 0 2px 4px #000;
        opacity: 0; z-index: 2; pointer-events: none;
      }
      #top-hud {
        position: absolute; top: 0; left: 0; right: 0;
        padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
        display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; gap: 8px;
      }
      #title-chip, #loot-toast, #msg-toast {
        background: rgba(20,10,6,0.78); border: 1px solid #5a3a28; border-radius: 10px; padding: 7px 12px; font-size: 13px;
      }
      #title-chip { font-weight: 700; color: #ffb060; }
      #title-chip .sub { font-weight: 500; color: #c89060; font-size: 11px; }
      #loot-toast { max-width: 55%; text-align: right; min-height: 1.2em; }
      .rarity-white { color: #e8e4dc; }
      .rarity-blue { color: #6db3ff; }
      .rarity-yellow { color: #ffd24a; }
      #overlay {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background-color: #1a0f0a;
        background-image:
          linear-gradient(180deg, rgba(8,4,2,0.55) 0%, rgba(10,5,3,0.72) 45%, rgba(8,4,2,0.88) 100%),
          url('./art/valley-menu.webp');
        background-size: cover;
        background-position: center;
        pointer-events: auto;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #overlay.end-screen {
        background-image:
          linear-gradient(180deg, rgba(8,4,2,0.58) 0%, rgba(10,5,3,0.78) 50%, rgba(8,4,2,0.9) 100%),
          url('./art/combat-key.webp');
      }
      #overlay.hidden { display: none; }
      .panel {
        background: rgba(42,24,16,0.92); border: 2px solid #7a4a30; border-radius: 16px; padding: 24px 20px; max-width: 380px; width: 90%;
        text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      }
      .art-preview, .art-strip {
        display: block; width: 100%; object-fit: cover; border-radius: 12px;
        border: 1px solid #7a4a30; margin: 0 auto 14px;
      }
      .art-preview { max-height: 120px; }
      .art-strip { max-height: 72px; margin-bottom: 12px; }
      .panel h1 { font-size: 30px; margin-bottom: 4px; color: #ffb060; }
      .panel h2 { font-size: 16px; font-weight: 600; color: #c89060; margin-bottom: 12px; }
      .panel p { font-size: 13px; line-height: 1.45; opacity: 0.9; margin-bottom: 10px; }
      .panel button {
        margin-top: 8px; min-height: 52px; width: 100%; border: none; border-radius: 12px;
        background: linear-gradient(180deg, #d07030, #a04818); color: #fff8f0; font-size: 17px; font-weight: 800; cursor: pointer;
      }
      .panel button:active { filter: brightness(0.9); }
      #move-stick {
        position: absolute;
        left: max(16px, env(safe-area-inset-left, 0px));
        bottom: calc(148px + env(safe-area-inset-bottom, 0px));
        width: 128px; height: 128px; border-radius: 50%;
        background: rgba(40,24,16,0.5); border: 2px solid rgba(120,80,50,0.6); pointer-events: auto;
        touch-action: none;
      }
      #move-knob {
        position: absolute; left: 44px; top: 44px; width: 40px; height: 40px; border-radius: 50%;
        background: rgba(220,140,70,0.8); border: 2px solid #f0c080; pointer-events: none;
      }
      @media (min-width: 900px) {
        #skills { max-width: 520px; margin-left: auto; }
        #move-stick { bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
      }
      @media (max-width: 400px) {
        .skill-btn { min-height: 76px; }
        .skill-btn .name { font-size: 12px; }
        #move-stick { width: 118px; height: 118px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="top-hud">
        <div id="title-chip">Dolina <span class="sub">· Emberfall combat</span></div>
        <div id="loot-toast"></div>
      </div>
      <div id="move-stick"><div id="move-knob"></div></div>
      <div id="hud">
        <div id="bars">
          <div class="bar-wrap"><div id="hp-fill" class="bar-fill"></div><div class="bar-label" id="hp-label">Življenje</div></div>
          <div class="bar-wrap"><div id="ember-fill" class="bar-fill"></div><div class="bar-label" id="ember-label">Žerjavica</div></div>
        </div>
        <div id="skills">
          <button class="skill-btn" id="btn-basic" type="button">
            <span class="name">Pepelni Udar</span><span class="hint">osnovni · 1</span>
            <span class="cd-num" id="cd-basic"></span>
          </button>
          <button class="skill-btn" id="btn-spiral" type="button">
            <span class="name">Žerjavni Vrtinec</span><span class="hint">AoE · 2</span>
            <span class="cd-num" id="cd-spiral"></span>
          </button>
          <button class="skill-btn" id="btn-ashwake" type="button">
            <span class="name">Pepelni Prebud</span><span class="hint">dash · 3</span>
            <span class="cd-num" id="cd-ashwake"></span>
          </button>
        </div>
      </div>
      <div id="overlay">
        <div class="panel">
          <img class="art-preview" src="./art/ashgate-portal.webp" alt="" width="340" height="120" decoding="async" />
          <h1>Dolina</h1>
          <h2>Ashblade · Ashgates combat prototype</h2>
          <p>Peščene ruševine. Preživi pakete, zlomi elitno četo, poberi plen (belo / modro / rumeno).</p>
          <p>Premik: velik stick ali WASD. Spretnosti: veliki gumbi spodaj (1 / 2 / 3).</p>
          <button id="btn-start" type="button">Vstopi v Ashgates</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
