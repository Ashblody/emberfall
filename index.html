    <title>Dolina · Emberfall</title>
    <style>*{box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent;margin:0;padding:0}html,body{color:#f5e6d3;background:#1a0f0a;width:100%;height:100%;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}#app{flex-direction:column;display:flex;position:fixed;inset:0}#game-canvas{background:#2a1a10;flex:1;width:100%;height:100%;display:block}#hud{padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));pointer-events:none;background:linear-gradient(#0000,#0c0604f0 30%);position:absolute;bottom:0;left:0;right:0}#bars{pointer-events:none;gap:10px;margin-bottom:10px;display:flex}.bar-wrap{background:#2a1810;border:1px solid #5a3a28;border-radius:10px;flex:1;height:26px;position:relative;overflow:hidden}.bar-fill{height:100%;transition:width .12s linear}#hp-fill{background:linear-gradient(90deg,#8b1e1e,#d44);width:100%}#ember-fill{background:linear-gradient(90deg,#b85a10,#f0a030);width:100%}.bar-label{text-shadow:0 1px 2px #000;pointer-events:none;justify-content:center;align-items:center;font-size:12px;font-weight:700;display:flex;position:absolute;inset:0}#skills{pointer-events:auto;grid-template-columns:1.15fr 1fr 1fr;gap:12px;display:grid}.skill-btn{color:#f5e6d3;cursor:pointer;-webkit-user-select:none;user-select:none;--cd-pct:0%;background:#3a2218;border:2px solid #6a4030;border-radius:16px;flex-direction:column;justify-content:center;align-items:center;gap:3px;min-height:84px;padding:10px 8px;font-size:14px;font-weight:700;display:flex;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #ffb45026,0 5px #1a0e08}.skill-btn:after{content:"";height:var(--cd-pct);pointer-events:none;background:#0804029e;transition:height 80ms linear;position:absolute;bottom:0;left:0;right:0}.skill-btn:active,.skill-btn.pressed{background:#4a2c1c;transform:translateY(3px);box-shadow:inset 0 0 0 1px #ffb45026}.skill-btn.cd{opacity:.88}.skill-btn .name{letter-spacing:.02em;z-index:1;font-size:13px;position:relative}.skill-btn .hint{opacity:.75;z-index:1;font-size:11px;font-weight:500;position:relative}.skill-btn .cd-num{color:#ffe0a0;text-shadow:0 2px 4px #000;opacity:0;z-index:2;pointer-events:none;justify-content:center;align-items:center;font-size:22px;font-weight:800;display:flex;position:absolute;inset:0}#top-hud{padding:calc(10px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) 8px max(12px, env(safe-area-inset-left,0px));pointer-events:none;justify-content:space-between;align-items:flex-start;gap:8px;display:flex;position:absolute;top:0;left:0;right:0}#title-chip,#loot-toast,#msg-toast{background:#140a06c7;border:1px solid #5a3a28;border-radius:10px;padding:7px 12px;font-size:13px}#title-chip{color:#ffb060;font-weight:700}#title-chip .sub{color:#c89060;font-size:11px;font-weight:500}#loot-toast{text-align:right;max-width:55%;min-height:1.2em}.rarity-white{color:#e8e4dc}.rarity-blue{color:#6db3ff}.rarity-yellow{color:#ffd24a}#overlay{pointer-events:auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background-color:#1a0f0a;background-image:linear-gradient(#0804028c 0%,#0a0503b8 45%,#080402e0 100%),url(./art/valley-menu.webp);background-position:50%;background-size:cover;justify-content:center;align-items:center;display:flex;position:absolute;inset:0}#overlay.end-screen{background-image:linear-gradient(#08040294 0%,#0a0503c7 50%,#080402e6 100%),url(./art/combat-key.webp)}#overlay.hidden{display:none}.panel{text-align:center;background:#2a1810eb;border:2px solid #7a4a30;border-radius:16px;width:90%;max-width:380px;padding:24px 20px;box-shadow:0 12px 40px #00000080}.art-preview,.art-strip{object-fit:cover;border:1px solid #7a4a30;border-radius:12px;width:100%;margin:0 auto 14px;display:block}.art-preview{max-height:120px}.art-strip{max-height:72px;margin-bottom:12px}.roster{text-align:center;margin:4px 0 14px}.roster-tabs{justify-content:center;gap:8px;margin-bottom:10px;display:flex}.roster-tab{color:#c89060;cursor:pointer;min-height:36px;box-shadow:none;background:#1e100abf;border:1px solid #7a4a30;border-radius:999px;flex:1;margin:0;padding:6px 10px;font-size:13px;font-weight:700}.roster-tab.active{color:#fff8f0;background:linear-gradient(#a05828,#7a3818);border-color:#c87840}.roster-tab:active{filter:brightness(.95)}.roster-sheet{object-fit:contain;background:#140a068c;border:1px solid #7a4a30;border-radius:12px;width:100%;max-height:180px;margin:0 auto 6px;display:block}.roster-caption{opacity:.78;color:#c89060;margin:0;font-size:11px;line-height:1.35}.panel h1{color:#ffb060;margin-bottom:4px;font-size:30px}.panel h2{color:#c89060;margin-bottom:12px;font-size:16px;font-weight:600}.panel p{opacity:.9;margin-bottom:10px;font-size:13px;line-height:1.45}.panel button{color:#fff8f0;cursor:pointer;background:linear-gradient(#d07030,#a04818);border:none;border-radius:12px;width:100%;min-height:52px;margin-top:8px;font-size:17px;font-weight:800}.panel button:active{filter:brightness(.9)}.panel .roster-tab{color:#c89060;width:auto;min-height:36px;box-shadow:none;background:#1e100abf;border:1px solid #7a4a30;border-radius:999px;flex:1;margin:0;padding:6px 10px;font-size:13px;font-weight:700}.panel .roster-tab.active{color:#fff8f0;background:linear-gradient(#a05828,#7a3818);border-color:#c87840}.panel .roster-tab:active{filter:brightness(.95)}#move-stick{left:max(16px, env(safe-area-inset-left,0px));bottom:calc(148px + env(safe-area-inset-bottom,0px));pointer-events:auto;touch-action:none;background:#28181080;border:2px solid #78503299;border-radius:50%;width:128px;height:128px;position:absolute}#move-knob{pointer-events:none;background:#dc8c46cc;border:2px solid #f0c080;border-radius:50%;width:40px;height:40px;position:absolute;top:44px;left:44px}@media (width>=900px){#skills{max-width:520px;margin-left:auto}#move-stick{bottom:calc(160px + env(safe-area-inset-bottom,0px))}}@media (width<=400px){.skill-btn{min-height:76px}.skill-btn .name{font-size:12px}#move-stick{width:118px;height:118px}}</style>
    <script type="module" crossorigin src="./assets/index-BgtaIgnC.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="top-hud">
        <div id="title-chip">Dolina <span class="sub">· Emberfall combat</span></div>
        <div id="loot-toast"></div>
      </div>
      <div id="move-stick"><div id="move-knob"></div></div>
      <div id="hud">
        <div id="bars">
          <div class="bar-wrap"><div id="hp-fill" class="bar-fill"></div><div class="bar-label" id="hp-label">Življenje</div></div>
          <div class="bar-wrap"><div id="ember-fill" class="bar-fill"></div><div class="bar-label" id="ember-label">Žerjavica</div></div>
        </div>
        <div id="skills">
          <button class="skill-btn" id="btn-basic" type="button">
            <span class="name">Pepelni Udar</span><span class="hint">osnovni · 1</span>
            <span class="cd-num" id="cd-basic"></span>
          </button>
          <button class="skill-btn" id="btn-spiral" type="button">
            <span class="name">Žerjavni Vrtinec</span><span class="hint">AoE · 2</span>
            <span class="cd-num" id="cd-spiral"></span>
          </button>
          <button class="skill-btn" id="btn-ashwake" type="button">
            <span class="name">Pepelni Prebud</span><span class="hint">dash · 3</span>
            <span class="cd-num" id="cd-ashwake"></span>
          </button>
        </div>
      </div>
      <div id="overlay">
        <div class="panel">
          <img class="art-preview" src="./art/ashgate-portal.webp" alt="" width="340" height="120" decoding="async" />
          <h1>Dolina</h1>
          <h2>Ashblade · Ashgates combat prototype</h2>
          <div class="roster" id="roster">
            <div class="roster-tabs" role="tablist" aria-label="Predogled ekipe">
              <button type="button" class="roster-tab active" role="tab" aria-selected="true" data-roster="hero" id="roster-tab-hero">Ashblade</button>
              <button type="button" class="roster-tab" role="tab" aria-selected="false" data-roster="enemy" id="roster-tab-enemy">Sovražniki</button>
            </div>
            <img class="roster-sheet" id="roster-sheet" src="./art/hero-sheet.webp" alt="Ashblade predogled" width="340" height="180" decoding="async" />
            <p class="roster-caption" id="roster-caption">Ashblade · v igri concept art sprite</p>
          </div>
          <p>Peščene ruševine. Preživi pakete, zlomi elitno četo, poberi plen (belo / modro / rumeno).</p>
          <p>Premik: velik stick ali WASD. Spretnosti: veliki gumbi spodaj (1 / 2 / 3).</p>
          <button id="btn-start" type="button">Vstopi v Ashgates</button>
        </div>
      </div>
    </div>
  </body>
</html>
