<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0f0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Emberfall — Ashblade vrušajo skozi Ashgates. Dotikalna ARPG." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Emberfall</title>
    <style>*{box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent;margin:0;padding:0}html,body{color:#f5e6d3;background:#1a0f0a;width:100%;height:100%;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}#app{flex-direction:column;display:flex;position:fixed;inset:0}#game-canvas{background:#2a1a10;flex:1;width:100%;height:100%;display:block}#hud{padding:8px 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none;background:linear-gradient(#0000,#0c0604eb 28%);position:absolute;bottom:0;left:0;right:0}#bars{pointer-events:none;gap:8px;margin-bottom:8px;display:flex}.bar-wrap{background:#2a1810;border:1px solid #5a3a28;border-radius:8px;flex:1;height:22px;position:relative;overflow:hidden}.bar-fill{height:100%;transition:width .12s linear}#hp-fill{background:linear-gradient(90deg,#8b1e1e,#d44);width:100%}#ember-fill{background:linear-gradient(90deg,#b85a10,#f0a030);width:100%}.bar-label{text-shadow:0 1px 2px #000;pointer-events:none;justify-content:center;align-items:center;font-size:11px;font-weight:700;display:flex;position:absolute;inset:0}#skills{pointer-events:auto;grid-template-columns:1.1fr 1fr 1fr;gap:10px;display:grid}.skill-btn{color:#f5e6d3;cursor:pointer;-webkit-user-select:none;user-select:none;background:#3a2218;border:2px solid #6a4030;border-radius:14px;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-height:72px;padding:8px;font-size:13px;font-weight:700;display:flex;box-shadow:inset 0 0 0 1px #ffb45026,0 4px #1a0e08}.skill-btn:active,.skill-btn.pressed{background:#4a2c1c;transform:translateY(2px);box-shadow:inset 0 0 0 1px #ffb45026}.skill-btn.cd{opacity:.55}.skill-btn .name{letter-spacing:.02em;font-size:12px}.skill-btn .hint{opacity:.75;font-size:10px;font-weight:500}#top-hud{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;pointer-events:none;justify-content:space-between;align-items:flex-start;gap:8px;display:flex;position:absolute;top:0;left:0;right:0}#title-chip,#loot-toast,#msg-toast{background:#140a06bf;border:1px solid #5a3a28;border-radius:10px;padding:6px 10px;font-size:12px}#loot-toast{text-align:right;max-width:55%;min-height:1.2em}.rarity-white{color:#e8e4dc}.rarity-blue{color:#6db3ff}.rarity-yellow{color:#ffd24a}#overlay{pointer-events:auto;background:#0a0503b8;justify-content:center;align-items:center;display:flex;position:absolute;inset:0}#overlay.hidden{display:none}.panel{text-align:center;background:#2a1810;border:2px solid #7a4a30;border-radius:16px;width:90%;max-width:360px;padding:22px 20px;box-shadow:0 12px 40px #00000080}.panel h1{color:#ffb060;margin-bottom:4px;font-size:28px}.panel h2{color:#c89060;margin-bottom:12px;font-size:16px;font-weight:600}.panel p{opacity:.9;margin-bottom:10px;font-size:13px;line-height:1.45}.panel button{color:#fff8f0;cursor:pointer;background:linear-gradient(#d07030,#a04818);border:none;border-radius:12px;width:100%;min-height:48px;margin-top:8px;font-size:16px;font-weight:800}.panel button:active{filter:brightness(.9)}#move-stick{pointer-events:auto;touch-action:none;background:#28181073;border:2px solid #7850328c;border-radius:50%;width:110px;height:110px;position:absolute;bottom:120px;left:16px}#move-knob{pointer-events:none;background:#dc8c46bf;border:2px solid #f0c080;border-radius:50%;width:40px;height:40px;position:absolute;top:35px;left:35px}@media (width>=900px){#skills{max-width:480px;margin-left:auto}#move-stick{bottom:140px}}</style>
    <script type="module" crossorigin src="./assets/index-Dq3pVWpU.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="top-hud">
        <div id="title-chip">Emberfall · Ashgates</div>
        <div id="loot-toast"></div>
      </div>
      <div id="move-stick"><div id="move-knob"></div></div>
      <div id="hud">
        <div id="bars">
          <div class="bar-wrap"><div id="hp-fill" class="bar-fill"></div><div class="bar-label" id="hp-label">Življenje</div></div>
          <div class="bar-wrap"><div id="ember-fill" class="bar-fill"></div><div class="bar-label" id="ember-label">Žerjavica</div></div>
        </div>
        <div id="skills">
          <button class="skill-btn" id="btn-basic" type="button"><span class="name">Pepelni Udar</span><span class="hint">osnovni</span></button>
          <button class="skill-btn" id="btn-spiral" type="button"><span class="name">Žerjavni Vrtinec</span><span class="hint">območje</span></button>
          <button class="skill-btn" id="btn-ashwake" type="button"><span class="name">Pepelni Prebud</span><span class="hint">dash + udar</span></button>
        </div>
      </div>
      <div id="overlay">
        <div class="panel">
          <h1>Emberfall</h1>
          <h2>Ashblade · Ashgates</h2>
          <p>Peščene ruševine. Preživi pakete, zlomi elitno četo, poberi plen (belo / modro / rumeno).</p>
          <p>Premik: virtualni stick ali WASD. Spretnosti: veliki gumbi spodaj (ali 1/2/3).</p>
          <button id="btn-start" type="button">Vstopi v Ashgates</button>
        </div>
      </div>
    </div>
  </body>
</html>
